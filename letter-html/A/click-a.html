<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../src/scss/main.css">
    <title>Любознайка - «А» в гостях у слов!</title>
</head>

<body>

    <body>
        <div id="header-placeholder"></div>

        <main>
            <section class="click-a" id="click">
                <h1 class="click-a__title">Помоги Любознайке! </h1>
                <p class="click-a__text">Найди на картинке слова, которые начинаются на букву «<span class="letter-yellow">А</span>» и нажми на них!</p>
                <p class="click-a__desc"><span class="yellow">А</span>ПЕЛЬСИН, <span class="yellow">А</span>НАНАС, <span
                        class="yellow">А</span>ВТОБУС</p>
                <div class="click-a__images">
                    <img src="../../public/alphabet/осьминог.webp" alt="осьминог" data-correct="false">
                    <img src="../../public/alphabet/ананас.webp" alt="ананас" data-correct="true">
                    <img src="../../public/alphabet/самолет.webp" alt="самолет" data-correct="false">
                    <img src="../../public/alphabet/апельсин.webp" alt="апельсин" data-correct="true">
                    <img src="../../public/alphabet/автобус.webp" alt="автобус" data-correct="true">
                    <img src="../../public/alphabet/помидор.webp" alt="помидор" data-correct="false">
                </div>
            </section>
            <section class="letter-btn">
                <a href="javascript:history.back()" class="btn-green">Назад</a>
                <a href="../../components html/end.html?letter=А" class="btn-yellow">Вперёд</a>
            </section>
        </main>

        <div id="footer-placeholder"></div>

        <script src="/js/include.js"></script>
        <script src="../../js/letters/A/click-a.js"></script>
    </body>

</body>

</html>
