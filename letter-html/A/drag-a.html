<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../src/scss/main.css">
    <title>Любознайка - «А» в гостях у слов!</title>
</head>

<body>

    <body>
        <div id="header-placeholder"></div>

        <main>
            <section class="drag-a" id="drag-a">
                <h1 class="drag__title">«<span class="letter-yellow">А</span>» в гостях у слов!</h1>
                <p class="drag__text">Буква "<span class="letter-yellow">А</span>" помогает начинаться словам: <span
                        class="letter-yellow">А</span>ИСТ, <span class="letter-yellow">А</span>РБУЗ, <span
                        class="letter-yellow">А</span>КУЛ<span class="letter-yellow">А</span>!</p>
                <div class="drag-a__items">
                    <div class="word-container">
                        <img src="public/alphabet/home-1.webp" alt="Домик 1">
                        <div class="word-house" id="house1">
                            <span class="placeholder">_</span>ИСТ
                        </div>
                    </div>
                    <div class="word-container">
                        <img src="public/alphabet/home-2.webp" alt="Домик 2">
                        <div class="word-house" id="house2">
                            <span class="placeholder">_</span>РБУЗ
                        </div>
                    </div>
                    <div class="word-container">
                        <img src="public/alphabet/home-3.webp" alt="Домик 3">
                        <div class="word-house" id="house3">
                            <span class="placeholder">_</span>КУЛА
                        </div>
                    </div>
                </div>
                <div class="letter-A" id="letter-A">Аа
                </div>
                <p class="drag-a__hint">Нажми и перетащи!</p>
            </section>
            <section class="letter-btn">
                
                    <a href="javascript:history.back()" class="btn-green">Назад</a>
                    <a href="../A/click-a.html" class="btn-yellow">Вперёд</a>
                
            </section>
        </main>

        <div id="footer-placeholder"></div>

        <script src="js/include.js"></script>
        <script src="js/letters/A/drag-a.js"></script>
    </body>

</body>

</html>
