<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../src/scss/main.css">
    <title>Любознайка - буква «Д»!</title>
</head>

<body>

    <body>
        <div id="header-placeholder"></div>

        <main>
            <section class="click-e" id="click-e">
                <h1 class="click-e__title">Поймай букву «<span class="letter-blue">Д</span>»!</h1>
                <p class="click-e__text">Шарики кружатся и не хотят останавливаться. Найди среди них те, где спряталась
                    буква «<span class="letter-blue">Д</span>», и нажми на них!</p>
                <div class="click-b__counter">
                    <p class="counter-text">Найдено шариков: <span id="counter">0</span> / 4</p>
                </div>
                <div class="click-e__container">
                    <p class="flying-letter flying-letter--blue" data-correct="true">Д</p>
                    <p class="flying-letter flying-letter--green" data-correct="false">В</p>
                    <p class="flying-letter flying-letter--yellow" data-correct="false">Г</p>
                    <p class="flying-letter flying-letter--purple" data-correct="false">А</p>
                    <p class="flying-letter flying-letter--blue" data-correct="false">В</p>
                    <p class="flying-letter flying-letter--yellow" data-correct="true">Д</p>
                    <p class="flying-letter flying-letter--green" data-correct="false">Г</p>
                    <p class="flying-letter flying-letter--blue" data-correct="false">Б</p>
                    <p class="flying-letter flying-letter--purple" data-correct="true">Д</p>
                    <p class="flying-letter flying-letter--yellow" data-correct="false">Б</p>
                    <p class="flying-letter flying-letter--blue" data-correct="false">А</p>
                    <p class="flying-letter flying-letter--green" data-correct="true">Д</p>
                </div>

            </section>
            <section class="letter-btn">

                <a href="javascript:history.back()" class="btn-green">Назад</a>
                <a href="doors-e.html" class="btn-yellow">Вперёд</a>

            </section>
        </main>

        <div id="footer-placeholder"></div>

        <script src="../../js/include.js"></script>
        <script src="../../js/letters/Д/click-e.js"></script>
    </body>

</body>

</html>
