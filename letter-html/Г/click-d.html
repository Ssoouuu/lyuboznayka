<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../src/scss/main.css">
    <title>Любознайка - буква «Г»!</title>
</head>

<body>

    <body>
        <div id="header-placeholder"></div>

        <main>
            <section class="click-d" id="click-d">
                <h1 class="click-d__title"><span class="letter-blue">Г</span>рибная полянка</h1>
                <p class="click-d__text">Любознайка очень любит собирать грибы. Но сегодня ему нужны только те, на шляпках которых есть буква «<span class="letter-blue">Г</span>». Давай поможем ему! Найди все такие грибочки и нажми на них.</p>
                <div class="click-b__counter">
                    <p class="counter-text">Найдено грибочков: <span id="counter">0</span> / 3</p>
                </div>
                <div class="click-d__items">
                    <img src="../../public/alphabet/Гриб-1.png" alt="Грибочек" data-correct="true" class="click-d__item">
                    <img src="../../public/alphabet/Гриб-2.png" alt="Грибочек" data-correct="false" class="click-d__item">
                    <img src="../../public/alphabet/Гриб-3.png" alt="Грибочек" data-correct="false" class="click-d__item">
                    <img src="../../public/alphabet/Гриб-4.png" alt="Грибочек" data-correct="true" class="click-d__item">
                    <img src="../../public/alphabet/Гриб-5.png" alt="Грибочек" data-correct="false" class="click-d__item">
                    <img src="../../public/alphabet/Гриб-6.png" alt="Грибочек" data-correct="true" class="click-d__item">
                    <img src="../../public/alphabet/Гриб-7.png" alt="Грибочек" data-correct="false" class="click-d__item">
                </div>
            </section>
            <section class="letter-btn">

                <a href="javascript:history.back()" class="btn-green">Назад</a>
                <a href="click-b.html" class="btn-yellow">Вперёд</a>

            </section>
        </main>

        <div id="footer-placeholder"></div>

        <script src="../../js/include.js"></script>
        <script src="../../js/letters/Г/click-d.js"></script>
    </body>

</body>

</html>
